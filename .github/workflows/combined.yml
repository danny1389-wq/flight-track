name: Combined fares merge
on:
  workflow_run:
        workflows: ["Track fares", "Kiwi Vietjet tracker"]
    types: [completed]
  workflow_dispatch:
    inputs:
      alerts:
        description: "Type yes to allow email alerts for this run (default: use the COMBINED_ALERTS repository variable, which is unset = off)"
        default: ""
permissions:
  contents: write
  issues: write
concurrency:
  group: combined-merge
  cancel-in-progress: false
jobs:
  merge:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python merge.py
        env:
          COMBINED_ALERTS: ${{ github.event.inputs.alerts || vars.COMBINED_ALERTS }}
          GH_TOKEN: ${{ github.token }}
      - name: Save results
        if: always()
        run: |
          git config user.name "fare-tracker"
          git config user.email "fare-tracker@users.noreply.github.com"
          git add data/combined
          git diff --cached --quiet || (git commit -m "Combined fares" && git pull --rebase -q && git push)
