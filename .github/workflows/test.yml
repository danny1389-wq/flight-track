name: Test views
on:
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 20
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install libraries
        run: python -m pip install "fast-flights==2.2" "primp==0.15.0" playwright
      - name: Install browser
        run: python -m playwright install chromium
      - name: Compare methods
        run: python test_views.py
        env:
          PYTHONIOENCODING: utf-8
