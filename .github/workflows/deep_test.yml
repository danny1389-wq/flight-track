name: Deep search test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python deep_test.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - name: Save result
        if: always()
        run: |
          git config user.name "fare-tracker"
          git config user.email "fare-tracker@users.noreply.github.com"
          git add data/deep_test.txt
          git diff --cached --quiet || (git commit -m "Deep search test result" && git pull --rebase -q && git push)
