name: Track fares
on:
  schedule:
    - cron: "5 * * * *"   # every hour
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: track
  cancel-in-progress: false
jobs:
  track:
    timeout-minutes: 55
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install libraries
        run: python -m pip install "fast-flights==2.2" "primp==0.15.0"
      - name: Scan fares
        run: python tracker.py
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
      - name: Commit new data
        if: always()
        run: |
          git config user.name "fare-tracker"
          git config user.email "fare-tracker@users.noreply.github.com"
          git add data/prices.csv data/latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update fares"
            git pull --rebase -q
            git push
          }
          exit 0
