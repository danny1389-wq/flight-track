name: Track fares
on:
  schedule:
    - cron: "0 19 * * *"   # once a day, about 6am Sydney
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: track
  cancel-in-progress: false
jobs:
  track:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tracker.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GH_TOKEN: ${{ github.token }}
      - name: Commit new data
        if: always()
        run: |
          git config user.name "fare-tracker"
          git config user.email "fare-tracker@users.noreply.github.com"
          git add data/prices.csv data/latest.json
          git diff --cached --quiet || (git commit -m "Update fares" && git pull --rebase -q && git push)
