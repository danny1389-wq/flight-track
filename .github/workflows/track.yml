name: Track fares
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "fast-flights==2.2" "primp==0.15.0" 
      - run: python tracker.py
      - name: Commit new data
        if: always()
        run: |
          git config user.name "fare-tracker"
          git config user.email "fare-tracker@users.noreply.github.com"
          git add data/prices.csv
          git diff --cached --quiet || (git commit -m "Update fares" && git push)
