name: Kiwi repeat test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python data/kiwi_test.py
      - name: Save result
        if: always()
        run: |
          git config user.name "fare-tracker"
          git config user.email "fare-tracker@users.noreply.github.com"
          git add data/kiwi_repeat.txt
          git diff --cached --quiet || (git commit -m "Kiwi repeat result" && git pull --rebase -q && git push)
