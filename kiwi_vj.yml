name: Kiwi Vietjet tracker (DRAFT - disabled)
on:
  workflow_dispatch:
    inputs:
      enable:
        description: "Type yes to actually call Kiwi (default no = does nothing)"
        default: "no"
      alerts:
        description: "Type yes to allow email alerts (default no)"
        default: "no"
  # schedule:                 # NOT enabled. Only add after Kiwi permission is settled and this has been reviewed.
  #   - cron: "20 20 * * *"   # once a day
permissions:
  contents: write
  issues: write
concurrency:
  group: kiwi-vj
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python kiwi_vj.py
        env:
          KIWI_VJ_ENABLED: ${{ github.event.inputs.enable }}
          KIWI_VJ_ALERTS: ${{ github.event.inputs.alerts }}
          GH_TOKEN: ${{ github.token }}
      - name: Save results
        if: always()
        run: |
          git config user.name "fare-tracker"
          git config user.email "fare-tracker@users.noreply.github.com"
          git add data/kiwi_vj
          git diff --cached --quiet || (git commit -m "Kiwi Vietjet data" && git pull --rebase -q && git push)
